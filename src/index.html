<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />

    <!--
      These values are the boot-time defaults. Everything else - and any change
      when the visitor switches language - is set by SeoService from
      src/app/core/data/profile.data.ts, which is the single source of truth.
    -->
    <title>Zaher Gaber | Full-Stack Angular Engineer</title>
    <meta
      name="description"
      content="Full-Stack Angular Engineer building scalable web, mobile, and backend platforms with Nx, Angular, Ionic, NestJS, and PostgreSQL."
    />
    <meta name="author" content="Zaher Gaber" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zahergaber.vercel.app" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zaher Gaber" />
    <meta property="og:title" content="Zaher Gaber | Full-Stack Angular Engineer" />
    <meta
      property="og:description"
      content="Full-Stack Angular Engineer building scalable web, mobile, and backend platforms with Nx, Angular, Ionic, NestJS, and PostgreSQL."
    />
    <meta property="og:url" content="https://zahergaber.vercel.app" />
    <meta property="og:image" content="https://zahergaber.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="brand/zg-dark-256.webp" />
    <meta name="theme-color" content="#0a0c11" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="dark">
    <app-root></app-root>

    <!--
      Applies the stored (or URL-requested) theme and language before first
      paint so a returning visitor never sees a flash of the wrong theme.
      WorkspacePreferencesService reads exactly the same keys and parameters.
    -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var theme = params.get('theme') || localStorage.getItem('portfolio-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.body.className = theme;
          document.documentElement.setAttribute('data-theme', theme);

          var lang = params.get('lang') || localStorage.getItem('portfolio-language');
          if (lang === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }

          var accent = localStorage.getItem('portfolio-accent');
          var accents = {
            blue: '#5b9dff',
            cyan: '#22d3ee',
            emerald: '#34d399',
            amber: '#f5b642',
            violet: '#a78bfa',
            rose: '#fb7185',
          };
          if (accents[accent]) {
            document.documentElement.style.setProperty('--accent', accents[accent]);
          }
        } catch (error) {
          /* Storage blocked: the prerendered defaults stay in place. */
        }
      })();
    </script>
  </body>
</html>
